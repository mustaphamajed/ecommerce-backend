spring.application.name=admin-backend

# Defaults for local runs; in Docker, the SPRING_DATASOURCE_* env vars (from .env) override them
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/admin}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}

# Hibernate creates/updates tables from the entities at startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.data.web.pageable.max-page-size=100

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.jwt.secret=${APP_JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=7d
app.auth.refresh-cookie.secure=${APP_REFRESH_COOKIE_SECURE:false}

app.bootstrap.admin.email=${APP_ADMIN_EMAIL:admin@shop.local}
app.bootstrap.admin.password=${APP_ADMIN_PASSWORD:admin12345}

app.seed.demo-data=${APP_SEED_DEMO_DATA:false}
app.seed.demo-password=${APP_SEED_DEMO_PASSWORD:demo12345}

# Run data.sql (seed data) on every start, after Hibernate has created the tables
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
logging.level.org.hibernate.SQL=debug

springdoc.api-docs.enabled=${APP_API_DOCS_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.display-request-duration=true

app.storage.endpoint=${APP_STORAGE_ENDPOINT:http://localhost:9000}
app.storage.region=${APP_STORAGE_REGION:us-east-1}
app.storage.access-key=${APP_STORAGE_ACCESS_KEY:rustfs}
app.storage.secret-key=${APP_STORAGE_SECRET_KEY:rustfs12345}
app.storage.bucket=${APP_STORAGE_BUCKET:product-images}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=system:monitor
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.info.java.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

spring.modulith.events.republish-outstanding-events-on-restart=true
spring.modulith.events.completion-mode=delete
