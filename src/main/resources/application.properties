spring.application.name=admin-backend

# Defaults for local runs; in Docker, the SPRING_DATASOURCE_* env vars (from .env) override them
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/admin}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}

# Hibernate creates/updates tables from the entities at startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.data.web.pageable.max-page-size=100

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.jwt.secret=${APP_JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=7d
app.auth.refresh-cookie.secure=${APP_REFRESH_COOKIE_SECURE:false}

app.bootstrap.admin.email=${APP_ADMIN_EMAIL:admin@shop.local}
app.bootstrap.admin.password=${APP_ADMIN_PASSWORD:admin12345}

app.seed.demo-data=${APP_SEED_DEMO_DATA:false}
app.seed.demo-password=${APP_SEED_DEMO_PASSWORD:demo12345}

# Run data.sql (seed data) on every start, after Hibernate has created the tables
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
logging.level.org.hibernate.SQL=debug
